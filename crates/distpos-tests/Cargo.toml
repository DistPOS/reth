[package]
name = "distpos-tests"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "distpos_tests"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
eyre = "0.6"

# Optional workspace dependencies, enabled by feature "reth-workspace".
# These will resolve once the crate is added to the root workspace.
reth-e2e-test-utils = { workspace = true, optional = true }
reth-exex-test-utils = { workspace = true, optional = true }
reth-node-builder = { workspace = true, optional = true }
jsonrpsee = { workspace = true, optional = true }

[features]
default = []
reth-workspace = [
  "reth-e2e-test-utils",
  "reth-exex-test-utils",
  "reth-node-builder",
  "jsonrpsee",
]