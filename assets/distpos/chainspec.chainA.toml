# DistPOS Chain A chainspec template (development)
# Referenced by harness/tools to spawn local multi-node networks.

name = "distpos-chainA"
chain_id = 100
network_id = 100

# Path to the genesis JSON for this chain (relative to repo root).
genesis_file = "assets/distpos/genesis.chainA.json"

# Bootnodes for local testing (fill with real enodes when available).
bootnodes = [
  # "enode://PUBKEY@127.0.0.1:30303",
]

[consensus]
# Placeholder marker indicating DistPOS consensus will be used for this network.
engine = "distpos"

[telemetry]
# Prometheus metrics port recommendation for local A nodes (starting base).
metrics_base_port = 9001